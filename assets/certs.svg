<svg xmlns="http://www.w3.org/2000/svg" width="880" height="408" viewBox="0 0 880 408" role="img" aria-label="Certifications">
  <title>Certifications</title>
  <defs>
    <pattern id="c-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#30363d" opacity=".55"/></pattern>
    <radialGradient id="c-halo" cx="0.04" cy="0.1" r="0.6"><stop offset="0" stop-color="#b1eb21" stop-opacity=".08"/><stop offset="1" stop-color="#b1eb21" stop-opacity="0"/></radialGradient>
    <filter id="c-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .cmd, .meta, .mk, .st, .id, .foot { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; }
    .cmd { font-size: 13px; fill: #e6edf3; }
    .meta { font-size: 11px; fill: #8b949e; }
    .nm { font-size: 14px; font-weight: 600; fill: #e6edf3; }
    .is { font-size: 12px; fill: #8b949e; }
    .mk { font-size: 10.5px; font-weight: 700; }
    .st { font-size: 10.5px; }
    .id { font-size: 10.5px; fill: #8b949e; }
    .foot { font-size: 11px; fill: #8b949e; }
    .r { animation: rin .55s ease-out both; }
    .hx { transform-box: fill-box; transform-origin: center; animation: spin .7s cubic-bezier(.3,1.5,.5,1) both; }
    .tick { stroke-dasharray: 10; animation: tick .5s ease-out both; }
    .cur { animation: blink 1.05s steps(1) infinite; }
    @keyframes rin { from { opacity: 0; transform: translateX(-12px); } }
    @keyframes spin { from { opacity: 0; transform: rotate(-90deg) scale(.4); } }
    @keyframes tick { from { stroke-dashoffset: 10; } to { stroke-dashoffset: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="1" y="1" width="878" height="406" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="878" height="406" rx="14" fill="url(#c-dots)"/>
  <rect x="1" y="1" width="878" height="406" rx="14" fill="url(#c-halo)"/>
  <text x="28" y="40" class="cmd"><tspan fill="#b1eb21">~/certs</tspan><tspan fill="#8b949e"> $ </tspan>verify --all</text>
  <rect x="206" y="29" width="8" height="14" fill="#b1eb21" class="cur"/>
  <text x="850" y="40" text-anchor="end" class="meta"><tspan fill="#b1eb21">2 publicly verifiable</tspan> · 5 credentials</text>
  <line x1="28" y1="58" x2="852" y2="58" stroke="#30363d"/>
  <g class="hx" style="animation-delay:0.25s"><polygon points="60.0,85.0 76.5,94.5 76.5,113.5 60.0,123.0 43.5,113.5 43.5,94.5" fill="#b1eb21" fill-opacity=".14" stroke="#b1eb21" stroke-width="1.6" filter="url(#c-glow)"/><text x="60" y="108" text-anchor="middle" class="mk" fill="#b1eb21">G</text></g><g class="r" style="animation-delay:0.25s"><text x="96" y="101" class="nm">System Administration and IT Infrastructure Services</text><text x="96" y="119" class="is">Google · Coursera · 2025</text><rect x="746" y="85" width="104" height="20" rx="10" fill="#b1eb21" fill-opacity=".1" stroke="#b1eb21" stroke-opacity=".6"/><path d="M760,95 l4,4 l8,-8" fill="none" stroke="#b1eb21" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" pathLength="10" class="tick" style="animation-delay:0.65s"/><text x="806" y="99" text-anchor="middle" class="st" fill="#b1eb21">verified</text><text x="850" y="119" text-anchor="end" class="id">coursera.org/verify/29N5ZLK6BVWW</text></g><g class="hx" style="animation-delay:0.39s"><polygon points="60.0,139.0 76.5,148.5 76.5,167.5 60.0,177.0 43.5,167.5 43.5,148.5" fill="#b1eb21" fill-opacity=".14" stroke="#b1eb21" stroke-width="1.6" filter="url(#c-glow)"/><text x="60" y="162" text-anchor="middle" class="mk" fill="#b1eb21">IBM</text></g><g class="r" style="animation-delay:0.39s"><text x="96" y="155" class="nm">Full Stack Software Developer Assessment</text><text x="96" y="173" class="is">IBM · Coursera · 2023</text><rect x="746" y="139" width="104" height="20" rx="10" fill="#b1eb21" fill-opacity=".1" stroke="#b1eb21" stroke-opacity=".6"/><path d="M760,149 l4,4 l8,-8" fill="none" stroke="#b1eb21" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" pathLength="10" class="tick" style="animation-delay:0.79s"/><text x="806" y="153" text-anchor="middle" class="st" fill="#b1eb21">verified</text><text x="850" y="173" text-anchor="end" class="id">coursera.org/verify/74NSF2JALFZV</text></g><g class="hx" style="animation-delay:0.53s"><polygon points="60.0,193.0 76.5,202.5 76.5,221.5 60.0,231.0 43.5,221.5 43.5,202.5" fill="#0d1117" fill-opacity="1" stroke="#30363d" stroke-width="1.6"/><text x="60" y="216" text-anchor="middle" class="mk" fill="#8b949e">OU</text></g><g class="r" style="animation-delay:0.53s"><text x="96" y="209" class="nm">Discovering Computer Networks: hands-on in the Open Networking Lab</text><text x="96" y="227" class="is">The Open University · 2023</text><rect x="746" y="193" width="104" height="20" rx="10" fill="none" stroke="#30363d"/><text x="798" y="207" text-anchor="middle" class="st" fill="#8b949e">on file</text><text x="850" y="227" text-anchor="end" class="id">statement of participation</text></g><g class="hx" style="animation-delay:0.67s"><polygon points="60.0,247.0 76.5,256.5 76.5,275.5 60.0,285.0 43.5,275.5 43.5,256.5" fill="#0d1117" fill-opacity="1" stroke="#30363d" stroke-width="1.6"/><text x="60" y="270" text-anchor="middle" class="mk" fill="#8b949e">OU</text></g><g class="r" style="animation-delay:0.67s"><text x="96" y="263" class="nm">Successful IT Systems</text><text x="96" y="281" class="is">The Open University · 2023</text><rect x="746" y="247" width="104" height="20" rx="10" fill="none" stroke="#30363d"/><text x="798" y="261" text-anchor="middle" class="st" fill="#8b949e">on file</text><text x="850" y="281" text-anchor="end" class="id">statement of participation</text></g><g class="hx" style="animation-delay:0.81s"><polygon points="60.0,301.0 76.5,310.5 76.5,329.5 60.0,339.0 43.5,329.5 43.5,310.5" fill="#0d1117" fill-opacity="1" stroke="#30363d" stroke-width="1.6"/><text x="60" y="324" text-anchor="middle" class="mk" fill="#8b949e">U</text></g><g class="r" style="animation-delay:0.81s"><text x="96" y="317" class="nm">Information Security Basics for IT Support Technicians</text><text x="96" y="335" class="is">Udemy · 2022</text><rect x="746" y="301" width="104" height="20" rx="10" fill="none" stroke="#30363d"/><text x="798" y="315" text-anchor="middle" class="st" fill="#8b949e">on file</text><text x="850" y="335" text-anchor="end" class="id">certificate of completion</text></g>
  <line x1="28" y1="358" x2="852" y2="358" stroke="#30363d" stroke-dasharray="3 5"/>
  <text x="28" y="380" class="foot"><tspan fill="#b1eb21">+ 20</tspan> completed courses in Python, data science, machine learning, SQL and software development</text>
</svg>
