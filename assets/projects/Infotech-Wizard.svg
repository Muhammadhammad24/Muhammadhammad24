<svg xmlns="http://www.w3.org/2000/svg" width="430" height="176" viewBox="0 0 430 176" role="img" aria-label="Infotech-Wizard">
  <title>Infotech-Wizard</title>
  
  <defs>
    <linearGradient id="infotech-wizard-edge"><stop offset="0" stop-color="#30363d"/></linearGradient>
    <linearGradient id="infotech-wizard-glow"><stop offset="0" stop-color="#0d1117" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .k { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; font-size: 10.5px; letter-spacing: 1.4px; fill: #8b949e; }
    .t { font-size: 20px; fill: #e6edf3; font-weight: 700; }
    .d { font-size: 13px; fill: #8b949e; }
    .t { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; }
    .chip { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; font-size: 11.5px; fill: #e6edf3; }
    .p { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #b1eb21; }
  </style>
  <rect x="0.5" y="0.5" width="429" height="175" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="22" width="3" height="40" fill="#b1eb21"/>
  <text x="22" y="32" class="k">AIOPS · RAG</text>
  <text x="408" y="32" text-anchor="end" class="p">tested API</text>
  <text x="22" y="58" class="t">Infotech-Wizard</text>
  <text x="22" y="82" class="d">Private GenAI helpdesk: retrieval over 3,531</text><text x="22" y="102" class="d">resolved tickets in 5 languages, local LLM.</text>
  <rect x="22" y="128" width="69" height="24" rx="4" fill="#161b22" stroke="#30363d"/><text x="56.5" y="144" text-anchor="middle" class="chip">FastAPI</text><rect x="99" y="128" width="55" height="24" rx="4" fill="#161b22" stroke="#30363d"/><text x="126.5" y="144" text-anchor="middle" class="chip">FAISS</text><rect x="162" y="128" width="69" height="24" rx="4" fill="#161b22" stroke="#30363d"/><text x="196.5" y="144" text-anchor="middle" class="chip">PyTorch</text><rect x="239" y="128" width="55" height="24" rx="4" fill="#161b22" stroke="#30363d"/><text x="266.5" y="144" text-anchor="middle" class="chip">React</text>
</svg>
