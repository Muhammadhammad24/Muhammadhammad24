  <line x1="69.0" y1="153" x2="354.5" y2="153" stroke="#8b949e" stroke-opacity=".55" stroke-width="1.5" class="wire"/><circle r="3.2" fill="#b1eb21" filter="url(#aws-terraform-platform-glow)" opacity="0"><animateMotion path="M69.0,153 L354.5,153" dur="3s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".4 0 .6 1"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle><g class="node" style="animation-delay:0.20s"><rect x="34.0" y="140" width="70.0" height="26" rx="6" fill="#0d1117" stroke="#30363d"/><text x="69.0" y="157" text-anchor="middle" class="nd" fill="#e6edf3">git push</text></g><g class="node" style="animation-delay:0.34s"><rect x="133.5" y="140" width="44.0" height="26" rx="6" fill="#0d1117" stroke="#30363d"/><text x="155.5" y="157" text-anchor="middle" class="nd" fill="#e6edf3">OIDC</text></g><g class="node" style="animation-delay:0.48s"><rect x="207.0" y="140" width="76.5" height="26" rx="6" fill="#0d1117" stroke="#30363d"/><text x="245.2" y="157" text-anchor="middle" class="nd" fill="#e6edf3">terraform</text></g><g class="node" style="animation-delay:0.62s"><rect x="313.0" y="140" width="83.0" height="26" rx="6" fill="#0d1117" stroke="#b1eb21"/><text x="354.5" y="157" text-anchor="middle" class="nd" fill="#b1eb21">AWS · 2 AZ</text></g>
  <g class="chipg" style="animation-delay:0.60s"><rect x="22" y="194" width="83" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="63.5" y="210" text-anchor="middle" class="chip">Terraform</text></g><g class="chipg" style="animation-delay:0.68s"><rect x="113" y="194" width="41" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="133.5" y="210" text-anchor="middle" class="chip">AWS</text></g><g class="chipg" style="animation-delay:0.76s"><rect x="162" y="194" width="119" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="221.5" y="210" text-anchor="middle" class="chip">GitHub Actions</text></g><g class="chipg" style="animation-delay:0.84s"><rect x="289" y="194" width="69" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="323.5" y="210" text-anchor="middle" class="chip">Checkov</text></g>
</svg>
