<svg xmlns="http://www.w3.org/2000/svg" width="430" height="236" viewBox="0 0 430 236" role="img" aria-label="nnapprox">
  <title>nnapprox</title>
  
  <defs>
    <pattern id="nnapprox-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#30363d" opacity=".5"/></pattern>
    <radialGradient id="nnapprox-halo" cx="0.95" cy="0" r="0.8"><stop offset="0" stop-color="#b1eb21" stop-opacity=".08"/><stop offset="1" stop-color="#b1eb21" stop-opacity="0"/></radialGradient>
    <filter id="nnapprox-glow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .k, .t, .chip, .p, .nd { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; }
    .k { font-size: 10.5px; letter-spacing: 1.4px; fill: #8b949e; }
    .t { font-size: 20px; fill: #e6edf3; font-weight: 700; }
    .d { font-size: 12.5px; fill: #8b949e; }
    .chip { font-size: 11px; fill: #e6edf3; }
    .p { font-size: 11px; fill: #b1eb21; }
    .nd { font-size: 10.5px; }
    .led { animation: led 1.8s ease-in-out infinite; }
    .node, .chipg { animation: pop .45s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
    .wire { stroke-dasharray: 4 5; animation: flow .9s linear infinite; }
    .drawn { stroke-dasharray: 100; animation: draw 1.6s ease-out .3s both; }
    @keyframes led { 50% { opacity: .25; } }
    @keyframes pop { from { opacity: 0; transform: scale(.6); } }
    @keyframes flow { to { stroke-dashoffset: -9; } }
    @keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0.5" y="0.5" width="429" height="235" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="429" height="235" rx="12" fill="url(#nnapprox-dots)"/>
  <rect x="0.5" y="0.5" width="429" height="235" rx="12" fill="url(#nnapprox-halo)"/>
  <circle cx="26" cy="28" r="3.5" fill="#b1eb21" class="led"/>
  <text x="38" y="32" class="k">AI RESEARCH</text>
  <text x="408" y="32" text-anchor="end" class="p">33 tests · O(n⁻²)</text>
  <text x="22" y="64" class="t">nnapprox</text>
  <text x="22" y="88" class="d">Deep ReLU network approximation: closed-form</text><text x="22" y="107" class="d">constructions against greedy growing axons.</text>
