<svg xmlns="http://www.w3.org/2000/svg" width="430" height="236" viewBox="0 0 430 236" role="img" aria-label="pfSense-Firewall-Lab">
  <title>pfSense-Firewall-Lab</title>
  
  <defs>
    <pattern id="pfsense-firewall-lab-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26272B" opacity=".5"/></pattern>
    <radialGradient id="pfsense-firewall-lab-halo" cx="0.95" cy="0" r="0.8"><stop offset="0" stop-color="#5B8DEF" stop-opacity=".08"/><stop offset="1" stop-color="#5B8DEF" stop-opacity="0"/></radialGradient>
    <filter id="pfsense-firewall-lab-glow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .k, .t, .chip, .p, .nd { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; }
    .k { font-size: 10.5px; letter-spacing: 1.4px; fill: #71757F; }
    .t { font-size: 20px; fill: #F5F5F7; font-weight: 700; }
    .d { font-size: 12.5px; fill: #71757F; }
    .chip { font-size: 11px; fill: #F5F5F7; }
    .p { font-size: 11px; fill: #5B8DEF; }
    .nd { font-size: 10.5px; }
    .led { animation: led 1.8s ease-in-out infinite; }
    .node, .chipg { animation: pop .45s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
    .wire { stroke-dasharray: 4 5; animation: flow .9s linear infinite; }
    .drawn { stroke-dasharray: 100; animation: draw 1.6s ease-out .3s both; }
    @keyframes led { 50% { opacity: .25; } }
    @keyframes pop { from { opacity: 0; transform: scale(.6); } }
    @keyframes flow { to { stroke-dashoffset: -9; } }
    @keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0.5" y="0.5" width="429" height="235" rx="12" fill="#09090B" stroke="#26272B"/>
  <rect x="0.5" y="0.5" width="429" height="235" rx="12" fill="url(#pfsense-firewall-lab-dots)"/>
  <rect x="0.5" y="0.5" width="429" height="235" rx="12" fill="url(#pfsense-firewall-lab-halo)"/>
  <circle cx="26" cy="28" r="3.5" fill="#5B8DEF" class="led"/>
  <text x="38" y="32" class="k">NETWORK SECURITY</text>
  <text x="408" y="32" text-anchor="end" class="p">22 tests · 0 findings</text>
  <text x="22" y="64" class="t">pfSense-Firewall-Lab</text>
  <text x="22" y="88" class="d">Firewall policy as code, rendered to pfSense XML</text><text x="22" y="107" class="d">and audited for risky rules before deployment.</text>
  <rect x="16" y="124" width="398" height="58" rx="9" fill="#141417" fill-opacity=".55" stroke="#26272B" stroke-dasharray="2 4"/>
  <line x1="78.8" y1="153" x2="364.2" y2="153" stroke="#71757F" stroke-opacity=".55" stroke-width="1.5" class="wire"/><circle r="3.2" fill="#5B8DEF" filter="url(#pfsense-firewall-lab-glow)" opacity="0"><animateMotion path="M78.8,153 L364.2,153" dur="3s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".4 0 .6 1"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle><g class="node" style="animation-delay:0.20s"><rect x="34.0" y="140" width="89.5" height="26" rx="6" fill="#09090B" stroke="#26272B"/><text x="78.8" y="157" text-anchor="middle" class="nd" fill="#F5F5F7">policy.toml</text></g><g class="node" style="animation-delay:0.34s"><rect x="157.3" y="140" width="57.0" height="26" rx="6" fill="#09090B" stroke="#26272B"/><text x="185.8" y="157" text-anchor="middle" class="nd" fill="#F5F5F7">render</text></g><g class="node" style="animation-delay:0.48s"><rect x="248.2" y="140" width="50.5" height="26" rx="6" fill="#09090B" stroke="#26272B"/><text x="273.4" y="157" text-anchor="middle" class="nd" fill="#F5F5F7">audit</text></g><g class="node" style="animation-delay:0.62s"><rect x="332.5" y="140" width="63.5" height="26" rx="6" fill="#09090B" stroke="#5B8DEF"/><text x="364.2" y="157" text-anchor="middle" class="nd" fill="#5B8DEF">pfSense</text></g>
  <g class="chipg" style="animation-delay:0.60s"><rect x="22" y="194" width="69" height="24" rx="12" fill="#141417" stroke="#26272B"/><text x="56.5" y="210" text-anchor="middle" class="chip">pfSense</text></g><g class="chipg" style="animation-delay:0.68s"><rect x="99" y="194" width="62" height="24" rx="12" fill="#141417" stroke="#26272B"/><text x="130.0" y="210" text-anchor="middle" class="chip">Python</text></g><g class="chipg" style="animation-delay:0.76s"><rect x="169" y="194" width="69" height="24" rx="12" fill="#141417" stroke="#26272B"/><text x="203.5" y="210" text-anchor="middle" class="chip">OpenVPN</text></g><g class="chipg" style="animation-delay:0.84s"><rect x="246" y="194" width="34" height="24" rx="12" fill="#141417" stroke="#26272B"/><text x="263.0" y="210" text-anchor="middle" class="chip">CI</text></g>
</svg>
