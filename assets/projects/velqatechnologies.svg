<svg xmlns="http://www.w3.org/2000/svg" width="430" height="236" viewBox="0 0 430 236" role="img" aria-label="velqatechnologies">
  <title>velqatechnologies</title>
  
  <defs>
    <pattern id="velqatechnologies-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#30363d" opacity=".5"/></pattern>
    <radialGradient id="velqatechnologies-halo" cx="0.95" cy="0" r="0.8"><stop offset="0" stop-color="#b1eb21" stop-opacity=".08"/><stop offset="1" stop-color="#b1eb21" stop-opacity="0"/></radialGradient>
    <filter id="velqatechnologies-glow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .k, .t, .chip, .p, .nd { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; }
    .k { font-size: 10.5px; letter-spacing: 1.4px; fill: #8b949e; }
    .t { font-size: 20px; fill: #e6edf3; font-weight: 700; }
    .d { font-size: 12.5px; fill: #8b949e; }
    .chip { font-size: 11px; fill: #e6edf3; }
    .p { font-size: 11px; fill: #b1eb21; }
    .nd { font-size: 10.5px; }
    .led { animation: led 1.8s ease-in-out infinite; }
    .node, .chipg { animation: pop .45s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
    .wire { stroke-dasharray: 4 5; animation: flow .9s linear infinite; }
    .drawn { stroke-dasharray: 100; animation: draw 1.6s ease-out .3s both; }
    @keyframes led { 50% { opacity: .25; } }
    @keyframes pop { from { opacity: 0; transform: scale(.6); } }
    @keyframes flow { to { stroke-dashoffset: -9; } }
    @keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0.5" y="0.5" width="429" height="235" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="429" height="235" rx="12" fill="url(#velqatechnologies-dots)"/>
  <rect x="0.5" y="0.5" width="429" height="235" rx="12" fill="url(#velqatechnologies-halo)"/>
  <circle cx="26" cy="28" r="3.5" fill="#b1eb21" class="led"/>
  <text x="38" y="32" class="k">WEB · EDGE</text>
  <text x="408" y="32" text-anchor="end" class="p">live · CI</text>
  <text x="22" y="64" class="t">velqatechnologies</text>
  <text x="22" y="88" class="d">Company website for a BPO firm: 33 statically</text><text x="22" y="107" class="d">exported routes served from the edge.</text>
  <rect x="16" y="124" width="398" height="58" rx="9" fill="#161b22" fill-opacity=".55" stroke="#30363d" stroke-dasharray="2 4"/>
  <line x1="75.5" y1="153" x2="364.2" y2="153" stroke="#8b949e" stroke-opacity=".55" stroke-width="1.5" class="wire"/><circle r="3.2" fill="#b1eb21" filter="url(#velqatechnologies-glow)" opacity="0"><animateMotion path="M75.5,153 L364.2,153" dur="3s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".4 0 .6 1"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle><g class="node" style="animation-delay:0.20s"><rect x="34.0" y="140" width="83.0" height="26" rx="6" fill="#0d1117" stroke="#30363d"/><text x="75.5" y="157" text-anchor="middle" class="nd" fill="#e6edf3">next build</text></g><g class="node" style="animation-delay:0.34s"><rect x="140.0" y="140" width="76.5" height="26" rx="6" fill="#0d1117" stroke="#30363d"/><text x="178.2" y="157" text-anchor="middle" class="nd" fill="#e6edf3">33 routes</text></g><g class="node" style="animation-delay:0.48s"><rect x="239.5" y="140" width="70.0" height="26" rx="6" fill="#0d1117" stroke="#30363d"/><text x="274.5" y="157" text-anchor="middle" class="nd" fill="#e6edf3">edge CDN</text></g><g class="node" style="animation-delay:0.62s"><rect x="332.5" y="140" width="63.5" height="26" rx="6" fill="#0d1117" stroke="#b1eb21"/><text x="364.2" y="157" text-anchor="middle" class="nd" fill="#b1eb21">visitor</text></g>
  <g class="chipg" style="animation-delay:0.60s"><rect x="22" y="194" width="69" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="56.5" y="210" text-anchor="middle" class="chip">Next.js</text></g><g class="chipg" style="animation-delay:0.68s"><rect x="99" y="194" width="91" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="144.5" y="210" text-anchor="middle" class="chip">TypeScript</text></g><g class="chipg" style="animation-delay:0.76s"><rect x="198" y="194" width="76" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="236.0" y="210" text-anchor="middle" class="chip">Tailwind</text></g>
