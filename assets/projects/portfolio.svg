<svg xmlns="http://www.w3.org/2000/svg" width="430" height="176" viewBox="0 0 430 176" role="img" aria-label="Portfolio">
  <title>Portfolio</title>
  
  <defs>
    <linearGradient id="portfolio-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#f0a04b"/>
    </linearGradient>
    <radialGradient id="portfolio-glow" cx="0.85" cy="0" r="0.9">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .k { font-size: 10.5px; letter-spacing: 1.6px; fill: #f0a04b; font-weight: 600; }
    .t { font-size: 20px; fill: #e6ebf5; font-weight: 700; }
    .d { font-size: 13px; fill: #8b97ad; }
    .chip { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; font-size: 11.5px; fill: #60a5fa; }
    .p { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #34d399; }
  </style>
  <rect x="1" y="1" width="428" height="174" rx="14" fill="#0a0d14" stroke="url(#portfolio-edge)" stroke-opacity=".6"/>
  <rect x="1" y="1" width="428" height="174" rx="14" fill="url(#portfolio-glow)"/>
  <text x="22" y="32" class="k">PERSONAL SITE</text>
  <text x="408" y="32" text-anchor="end" class="p">● live</text>
  <text x="22" y="58" class="t">Portfolio</text>
  <text x="22" y="82" class="d">Animated specialisation diagrams, skills matrix</text><text x="22" y="102" class="d">and a work timeline, deployed on Vercel.</text>
  <rect x="22" y="128" width="91" height="24" rx="12" fill="#0f1522" stroke="#1d2a40"/><text x="67.5" y="144" text-anchor="middle" class="chip">Next.js 15</text><rect x="121" y="128" width="76" height="24" rx="12" fill="#0f1522" stroke="#1d2a40"/><text x="159.0" y="144" text-anchor="middle" class="chip">React 19</text><rect x="205" y="128" width="112" height="24" rx="12" fill="#0f1522" stroke="#1d2a40"/><text x="261.0" y="144" text-anchor="middle" class="chip">Framer Motion</text>
</svg>
