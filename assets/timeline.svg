<svg xmlns="http://www.w3.org/2000/svg" width="880" height="514" viewBox="0 0 880 514" role="img" aria-label="Career as a git log, newest first">
  <title>Career</title>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#30363d" opacity=".55"/></pattern>
    <radialGradient id="halo" cx="0.06" cy="0.14" r="0.6"><stop offset="0" stop-color="#b1eb21" stop-opacity=".09"/><stop offset="1" stop-color="#b1eb21" stop-opacity="0"/></radialGradient>
    <linearGradient id="trunkfade" gradientUnits="userSpaceOnUse" x1="0" y1="422" x2="0" y2="100"><stop offset="0" stop-color="#b1eb21" stop-opacity=".3"/><stop offset="1" stop-color="#b1eb21"/></linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .sha, .chip, .yrs, .cmd, .meta, .foot, .lane { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; }
    .cmd { font-size: 13px; fill: #e6edf3; }
    .meta { font-size: 11px; fill: #8b949e; letter-spacing: .4px; }
    .sha { font-size: 11.5px; fill: #8b949e; }
    .role { font-size: 14px; font-weight: 600; fill: #e6edf3; }
    .org { font-size: 12px; fill: #8b949e; }
    .chip { font-size: 10px; }
    .yrs { font-size: 11.5px; fill: #e6edf3; }
    .lane { font-size: 9.5px; fill: #8b949e; letter-spacing: 1px; }
    .foot { font-size: 11px; fill: #8b949e; }
    .r { animation: rin .55s ease-out both; }
    .n { transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.3,1.7,.5,1) both; }
    .bar { transform-box: fill-box; transform-origin: right; animation: grow .9s ease-out both; }
    .trunk { stroke-dasharray: 322; animation: draw 1.66s linear .2s both; }
    .branch { stroke-dasharray: 5 5; animation: flow 1.2s linear infinite; }
    .branchwrap { animation: fade .6s ease-out 1.13s both; }
    .cur { animation: blink 1.05s steps(1) infinite; }
    .live { animation: blink 1.6s ease-in-out infinite; }
    @keyframes rin { from { opacity: 0; transform: translateX(-12px); } }
    @keyframes pop { from { transform: scale(0); } }
    @keyframes grow { from { transform: scaleX(0); } }
    @keyframes draw { from { stroke-dashoffset: 322; } to { stroke-dashoffset: 0; } }
    @keyframes flow { to { stroke-dashoffset: -10; } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="1" y="1" width="878" height="512" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="878" height="512" rx="14" fill="url(#dots)"/>
  <rect x="1" y="1" width="878" height="512" rx="14" fill="url(#halo)"/>

  <text x="28" y="40" class="cmd"><tspan fill="#b1eb21">~/career</tspan><tspan fill="#8b949e"> $ </tspan>git log --graph --all</text>
  <rect x="284" y="29" width="8" height="14" fill="#b1eb21" class="cur"/>
  <text x="850" y="40" text-anchor="end" class="meta">branch <tspan fill="#b1eb21">main</tspan> · 7 roles · 1 degree · since 2019</text>
