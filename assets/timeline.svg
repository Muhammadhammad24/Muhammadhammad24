  <g class="row" style="animation-delay:0.15s"><text x="28" y="70" class="lb">B.Sc. Computational Mathematics</text><text x="28" y="83" class="sb">University of Karachi</text><rect x="300.0" y="60" width="145.5" height="12" rx="6" fill="#8b97ad"/></g><g class="row" style="animation-delay:0.27s"><text x="28" y="100" class="lb">IT Engineer</text><text x="28" y="113" class="sb">The Active Solutions</text><rect x="463.1" y="90" width="47.7" height="12" rx="6" fill="#3b82f6"/></g><g class="row" style="animation-delay:0.39s"><text x="28" y="130" class="lb">IT Specialist</text><text x="28" y="143" class="sb">Target Logistics International</text><rect x="525.8" y="120" width="60.2" height="12" rx="6" fill="#3b82f6"/></g><g class="row" style="animation-delay:0.51s"><text x="28" y="160" class="lb">IT Specialist</text><text x="28" y="173" class="sb">KTDMC</text><rect x="588.5" y="150" width="32.6" height="12" rx="6" fill="#3b82f6"/></g><g class="row" style="animation-delay:0.63s"><text x="28" y="190" class="lb">IT Specialist</text><text x="28" y="203" class="sb">Liberty Books</text><rect x="622.2" y="180" width="19.1" height="12" rx="6" fill="#3b82f6"/></g><g class="row" style="animation-delay:0.75s"><text x="28" y="220" class="lb">IT Engineer · contract</text><text x="28" y="233" class="sb">TestSolutions GmbH</text><rect x="655.3" y="210" width="93.8" height="12" rx="6" fill="#60a5fa"/></g><g class="row" style="animation-delay:0.87s"><text x="28" y="250" class="lb">M.Sc. Data Science</text><text x="28" y="263" class="sb">University of Göttingen</text><rect x="651.3" y="240" width="148.0" height="12" rx="6" fill="#8b97ad"/></g><g class="row" style="animation-delay:0.99s"><text x="28" y="280" class="lb">IT Engineer</text><text x="28" y="293" class="sb">Kontinental Establishment</text><rect x="663.8" y="270" width="171.5" height="12" rx="6" fill="#f0a04b"/><circle cx="835.3" cy="276" r="4.5" fill="#f0a04b" class="pulse"/></g><g class="row" style="animation-delay:1.11s"><text x="