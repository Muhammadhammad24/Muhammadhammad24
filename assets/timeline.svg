<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-label="Career timeline from 2016 to today">
  <title>Career timeline</title>
  
  <defs>
    <linearGradient id="tl-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#f0a04b"/>
    </linearGradient>
    <radialGradient id="tl-glow" cx="0.85" cy="0" r="0.9">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .h { font-size: 11px; letter-spacing: 1.8px; fill: #f0a04b; font-weight: 600; }
    .yr { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: #8b97ad; }
    .lg { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; font-size: 10.5px; }
    .lb { font-size: 12.5px; fill: #e6ebf5; font-weight: 600; }
    .sb { font-size: 11px; fill: #8b97ad; }
    .row { opacity: 0; animation: in .45s ease-out forwards; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 50% { opacity: .2; } }
    @media (prefers-reduced-motion: reduce) { .row, .pulse { animation: none; opacity: 1; } }
  </style>
  <rect x="1" y="1" width="878" height="378" rx="14" fill="#0a0d14" stroke="url(#tl-edge)" stroke-opacity=".5"/>
  <rect x="1" y="1" width="878" height="378" rx="14" fill="url(#tl-glow)"/>
  <text x="28" y="34" class="h">CAREER · 2016 → TODAY</text>
  <text x="852" y="34" text-anchor="end" class="lg"><tspan fill="#f0a04b">● current</tspan><tspan fill="#60a5fa">   ● industry</tspan><tspan fill="#34d399">   ● research</tspan><tspan fill="#8b97ad">   ● education</tspan></text>
