<svg xmlns="http://www.w3.org/2000/svg" width="880" height="64" viewBox="0 0 880 64" role="img" aria-label="Full Stack Software Developer Assessment">
  <title>Full Stack Software Developer Assessment</title>
  <defs>
    <pattern id="c1-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#30363d" opacity=".55"/></pattern>
    <radialGradient id="c1-halo" cx="0.04" cy="0.2" r="0.7"><stop offset="0" stop-color="#b1eb21" stop-opacity=".09"/><stop offset="1" stop-color="#b1eb21" stop-opacity="0"/></radialGradient>
    <filter id="c1-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .cmd, .meta, .mk, .st, .id { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; }
    .cmd { font-size: 13px; fill: #e6edf3; }
    .meta { font-size: 11px; fill: #8b949e; }
    .nm { font-size: 14px; font-weight: 600; fill: #e6edf3; }
    .is { font-size: 12px; fill: #8b949e; }
    .mk { font-size: 10.5px; font-weight: 700; }
    .st { font-size: 10.5px; }
    .id { font-size: 10.5px; }
    .r { animation: rin .55s ease-out both; }
    .hx { transform-box: fill-box; transform-origin: center; animation: spin .7s cubic-bezier(.3,1.5,.5,1) both; }
    .tick { stroke-dasharray: 10; animation: tick .5s ease-out both; }
    .cur { animation: blink 1.05s steps(1) infinite; }
    @keyframes rin { from { opacity: 0; transform: translateX(-12px); } }
    @keyframes spin { from { opacity: 0; transform: rotate(-90deg) scale(.4); } }
    @keyframes tick { from { stroke-dashoffset: 10; } to { stroke-dashoffset: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="1" y="1" width="878" height="62" rx="12" fill="#0d1117" stroke="#b1eb21" stroke-opacity=".45"/>
  <rect x="1" y="1" width="878" height="62" rx="12" fill="url(#c1-dots)"/>
  <rect x="1" y="1" width="878" height="62" rx="12" fill="url(#c1-halo)"/>
  <g class="hx" style="animation-delay:0.27s"><polygon points="50.0,13.0 66.5,22.5 66.5,41.5 50.0,51.0 33.5,41.5 33.5,22.5" fill="#b1eb21" fill-opacity=".14" stroke="#b1eb21" stroke-width="1.6" filter="url(#c1-glow)"/><text x="50" y="36" text-anchor="middle" class="mk" fill="#b1eb21">IBM</text></g>
  <g class="r" style="animation-delay:0.27s">
    <text x="86" y="29" class="nm">Full Stack Software Developer Assessment</text>
    <text x="86" y="47" class="is">IBM · Coursera · 2023</text>
    <rect x="734" y="12" width="118" height="22" rx="11" fill="#b1eb21" fill-opacity=".12" stroke="#b1eb21" stroke-opacity=".7"/><path d="M748,23 l4,4 l8,-8" fill="none" stroke="#b1eb21" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" pathLength="10" class="tick" style="animation-delay:0.67s"/><text x="802" y="27" text-anchor="middle" class="st" fill="#b1eb21">verify ↗</text><text x="852" y="49" text-anchor="end" class="id" fill="#b1eb21" fill-opacity=".8">coursera.org/verify/74NSF2JALFZV</text>
  </g>
</svg>
