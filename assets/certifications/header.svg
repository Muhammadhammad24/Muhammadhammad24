<svg xmlns="http://www.w3.org/2000/svg" width="880" height="60" viewBox="0 0 880 60" role="img" aria-label="Certifications">
  <title>Certifications</title>
  <defs>
    <pattern id="hd-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#4A4A55" opacity=".5"/></pattern>
    <radialGradient id="hd-halo" cx="0" cy="0" r="0.9"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text { font-family: 'IBM Plex Sans', 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .m, .cmd, .meta, .tag, .tr, .mk { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, monospace; }
    .cmd { font-size: 13px; fill: #F7F8FA; }
    .meta { font-size: 11px; fill: #777982; }
    .nm { font-size: 13px; font-weight: 600; fill: #F7F8FA; }
    .is { font-size: 11px; fill: #777982; }
    .mk { font-size: 10px; font-weight: 700; fill: #FFFFFF; }
    .tag { font-size: 10px; fill: #777982; }
    .tr { font-size: 11px; letter-spacing: 1.6px; fill: #777982; }
    .in { animation: rin .5s ease-out both; }
    .hx { animation: rin .5s ease-out both; }
    .cur { animation: blink 1.05s steps(1) infinite; }
    @keyframes rin { from { opacity: 0; transform: translateX(-10px); } }
    @keyframes spin { from { opacity: 0; transform: rotate(-90deg) scale(.4); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0.5" y="0.5" width="879" height="59" rx="10" fill="#000000" stroke="#4A4A55"/>
  <rect x="0.5" y="0.5" width="879" height="59" rx="10" fill="url(#hd-dots)"/>
  <rect x="0.5" y="0.5" width="879" height="59" rx="10" fill="url(#hd-halo)"/>
  <text x="26" y="35" class="cmd"><tspan fill="#FFFFFF">~/certs</tspan><tspan fill="#777982"> $ </tspan>ls --featured</text>
  <rect x="219" y="24" width="8" height="14" fill="#FFFFFF" class="cur"/>
  <text x="854" y="35" text-anchor="end" class="meta">29 credentials · Google · IBM · Open University · Udemy · 12 shown</text>
</svg>
