<svg xmlns="http://www.w3.org/2000/svg" width="430" height="92" viewBox="0 0 430 92" role="img" aria-label="Successful IT Systems">
  <title>Successful IT Systems</title>
  <defs>
    <pattern id="t1c4-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2C2C31" opacity=".5"/></pattern>
    <radialGradient id="t1c4-halo" cx="0" cy="0" r="0.9"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .m, .cmd, .meta, .tag, .tr, .mk { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; }
    .cmd { font-size: 13px; fill: #E4E5E9; }
    .meta { font-size: 11px; fill: #6A6C74; }
    .nm { font-size: 13px; font-weight: 600; fill: #E4E5E9; }
    .is { font-size: 11px; fill: #6A6C74; }
    .mk { font-size: 10px; font-weight: 700; fill: #FFFFFF; }
    .tag { font-size: 10px; fill: #6A6C74; }
    .tr { font-size: 11px; letter-spacing: 1.6px; fill: #6A6C74; }
    .in { animation: rin .5s ease-out both; }
    .hx { animation: rin .5s ease-out both; }
    .cur { animation: blink 1.05s steps(1) infinite; }
    @keyframes rin { from { opacity: 0; transform: translateX(-10px); } }
    @keyframes spin { from { opacity: 0; transform: rotate(-90deg) scale(.4); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0.5" y="0.5" width="429" height="91" rx="10" fill="#040405" stroke="#2C2C31"/>
  <rect x="0.5" y="0.5" width="429" height="91" rx="10" fill="url(#t1c4-dots)"/>
  <rect x="0.5" y="0.5" width="429" height="91" rx="10" fill="url(#t1c4-halo)"/>
  <g class="hx" style="animation-delay:0.40s">
    <rect x="0" y="1" width="3" height="90" rx="1.5" fill="#FFFFFF"/>
  </g>
  <g class="in" style="animation-delay:0.40s">
    <text x="24" y="34" class="nm">Successful IT Systems</text>
    <text x="24" y="56" class="is">The Open University · 2023</text>
  </g>
  <rect x="342.8" y="62" width="71.2" height="20" rx="10" fill="none" stroke="#2C2C31"/>
  <text x="378.4" y="76" text-anchor="middle" class="tag">course ↗</text>
</svg>
