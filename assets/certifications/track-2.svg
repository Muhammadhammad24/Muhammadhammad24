<svg xmlns="http://www.w3.org/2000/svg" width="880" height="40" viewBox="0 0 880 40" role="img" aria-label="software engineering">
  <title>software engineering</title>
  <defs>
    <pattern id="tr2-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2C2C31" opacity=".5"/></pattern>
    <radialGradient id="tr2-halo" cx="0" cy="0" r="0.9"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .m, .cmd, .meta, .tag, .tr, .mk { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; }
    .cmd { font-size: 13px; fill: #E4E5E9; }
    .meta { font-size: 11px; fill: #6A6C74; }
    .nm { font-size: 13px; font-weight: 600; fill: #E4E5E9; }
    .is { font-size: 11px; fill: #6A6C74; }
    .mk { font-size: 10px; font-weight: 700; fill: #FFFFFF; }
    .tag { font-size: 10px; fill: #6A6C74; }
    .tr { font-size: 11px; letter-spacing: 1.6px; fill: #6A6C74; }
    .in { animation: rin .5s ease-out both; }
    .hx { animation: rin .5s ease-out both; }
    .cur { animation: blink 1.05s steps(1) infinite; }
    @keyframes rin { from { opacity: 0; transform: translateX(-10px); } }
    @keyframes spin { from { opacity: 0; transform: rotate(-90deg) scale(.4); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0.5" y="0.5" width="879" height="39" rx="10" fill="#040405" stroke="#2C2C31"/>
  <rect x="0.5" y="0.5" width="879" height="39" rx="10" fill="url(#tr2-dots)"/>
  <rect x="0.5" y="0.5" width="879" height="39" rx="10" fill="url(#tr2-halo)"/>
  <text x="20" y="25" class="tr in"><tspan fill="#FFFFFF">02</tspan>  SOFTWARE ENGINEERING</text>
  <line x1="219" y1="21" x2="730" y2="21" stroke="#2C2C31"/>
  <text x="860" y="25" text-anchor="end" class="tr">4 credentials</text>
</svg>
