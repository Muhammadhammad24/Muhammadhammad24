<svg xmlns="http://www.w3.org/2000/svg" width="880" height="40" viewBox="0 0 880 40" role="img" aria-label="data · machine learning · ai">
  <title>data · machine learning · ai</title>
  <defs>
    <pattern id="tr3-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#4A4A55" opacity=".5"/></pattern>
    <radialGradient id="tr3-halo" cx="0" cy="0" r="0.9"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text { font-family: 'IBM Plex Sans', 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .m, .cmd, .meta, .tag, .tr, .mk { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, monospace; }
    .cmd { font-size: 13px; fill: #F7F8FA; }
    .meta { font-size: 11px; fill: #777982; }
    .nm { font-size: 13px; font-weight: 600; fill: #F7F8FA; }
    .is { font-size: 11px; fill: #777982; }
    .mk { font-size: 10px; font-weight: 700; fill: #FFFFFF; }
    .tag { font-size: 10px; fill: #777982; }
    .tr { font-size: 11px; letter-spacing: 1.6px; fill: #777982; }
    .in { animation: rin .5s ease-out both; }
    .hx { animation: rin .5s ease-out both; }
    .cur { animation: blink 1.05s steps(1) infinite; }
    @keyframes rin { from { opacity: 0; transform: translateX(-10px); } }
    @keyframes spin { from { opacity: 0; transform: rotate(-90deg) scale(.4); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0.5" y="0.5" width="879" height="39" rx="10" fill="#000000" stroke="#4A4A55"/>
  <rect x="0.5" y="0.5" width="879" height="39" rx="10" fill="url(#tr3-dots)"/>
  <rect x="0.5" y="0.5" width="879" height="39" rx="10" fill="url(#tr3-halo)"/>
  <text x="20" y="25" class="tr in"><tspan fill="#FFFFFF">03</tspan>  DATA · MACHINE LEARNING · AI</text>
  <line x1="286" y1="21" x2="730" y2="21" stroke="#4A4A55"/>
  <text x="860" y="25" text-anchor="end" class="tr">4 credentials</text>
</svg>
