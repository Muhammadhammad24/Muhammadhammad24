<svg xmlns="http://www.w3.org/2000/svg" width="430" height="92" viewBox="0 0 430 92" role="img" aria-label="The Database Development Life Cycle">
  <title>The Database Development Life Cycle</title>
  <defs>
    <pattern id="t2c3-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26272B" opacity=".5"/></pattern>
    <radialGradient id="t2c3-halo" cx="0" cy="0" r="0.9"><stop offset="0" stop-color="#5B8DEF" stop-opacity=".06"/><stop offset="1" stop-color="#5B8DEF" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .m, .cmd, .meta, .tag, .tr, .mk { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; }
    .cmd { font-size: 13px; fill: #F5F5F7; }
    .meta { font-size: 11px; fill: #71757F; }
    .nm { font-size: 13px; font-weight: 600; fill: #F5F5F7; }
    .is { font-size: 11px; fill: #71757F; }
    .mk { font-size: 10px; font-weight: 700; fill: #5B8DEF; }
    .tag { font-size: 10px; fill: #71757F; }
    .tr { font-size: 11px; letter-spacing: 1.6px; fill: #71757F; }
    .in { animation: rin .5s ease-out both; }
    .hx { animation: rin .5s ease-out both; }
    .cur { animation: blink 1.05s steps(1) infinite; }
    @keyframes rin { from { opacity: 0; transform: translateX(-10px); } }
    @keyframes spin { from { opacity: 0; transform: rotate(-90deg) scale(.4); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0.5" y="0.5" width="429" height="91" rx="10" fill="#09090B" stroke="#26272B"/>
  <rect x="0.5" y="0.5" width="429" height="91" rx="10" fill="url(#t2c3-dots)"/>
  <rect x="0.5" y="0.5" width="429" height="91" rx="10" fill="url(#t2c3-halo)"/>
  <g class="hx" style="animation-delay:0.30s">
    <rect x="0" y="1" width="3" height="90" rx="1.5" fill="#5B8DEF"/>
    <text x="40" y="50" text-anchor="middle" class="mk">OU</text>
  </g>
  <g class="in" style="animation-delay:0.30s">
    <text x="70" y="34" class="nm">The Database Development Life Cycle</text>
    <text x="70" y="56" class="is">The Open University · 2023 · 12 h</text>
  </g>
  <rect x="342.8" y="62" width="71.2" height="20" rx="10" fill="none" stroke="#26272B"/>
  <text x="378.4" y="76" text-anchor="middle" class="tag">course ↗</text>
</svg>
