<svg xmlns="http://www.w3.org/2000/svg" width="880" height="60" viewBox="0 0 880 60" role="img" aria-label="Certifications">
  <title>Certifications</title>
  <defs>
    <pattern id="ch-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#30363d" opacity=".55"/></pattern>
    <radialGradient id="ch-halo" cx="0.04" cy="0.2" r="0.7"><stop offset="0" stop-color="#b1eb21" stop-opacity=".06"/><stop offset="1" stop-color="#b1eb21" stop-opacity="0"/></radialGradient>
    <filter id="ch-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .cmd, .meta, .mk, .st, .id { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; }
    .cmd { font-size: 13px; fill: #e6edf3; }
    .meta { font-size: 11px; fill: #8b949e; }
    .nm { font-size: 14px; font-weight: 600; fill: #e6edf3; }
    .is { font-size: 12px; fill: #8b949e; }
    .mk { font-size: 10.5px; font-weight: 700; }
    .st { font-size: 10.5px; }
    .id { font-size: 10.5px; }
    .r { animation: rin .55s ease-out both; }
    .hx { transform-box: fill-box; transform-origin: center; animation: spin .7s cubic-bezier(.3,1.5,.5,1) both; }
    .tick { stroke-dasharray: 10; animation: tick .5s ease-out both; }
    .cur { animation: blink 1.05s steps(1) infinite; }
    .btn { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; font-size: 12px; font-weight: 700; }
    .cta { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.2s ease-out 1.2s infinite; }
    .shine { animation: shine 2.8s ease-in-out 1s infinite; }
    @keyframes pop { from { opacity: 0; transform: scale(.7); } }
    @keyframes ring { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(1.12, 1.45); } }
    @keyframes shine { 0% { transform: translateX(0); } 60%, 100% { transform: translateX(300px); } }
    @keyframes rin { from { opacity: 0; transform: translateX(-12px); } }
    @keyframes spin { from { opacity: 0; transform: rotate(-90deg) scale(.4); } }
    @keyframes tick { from { stroke-dashoffset: 10; } to { stroke-dashoffset: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="1" y="1" width="878" height="58" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="878" height="58" rx="12" fill="url(#ch-dots)"/>
  <rect x="1" y="1" width="878" height="58" rx="12" fill="url(#ch-halo)"/>
  <text x="28" y="35" class="cmd"><tspan fill="#b1eb21">~/certs</tspan><tspan fill="#8b949e"> $ </tspan>verify --all</text>
  <rect x="206" y="24" width="8" height="14" fill="#b1eb21" class="cur"/>
  <text x="852" y="35" text-anchor="end" class="meta">5 credentials · <tspan fill="#b1eb21">2 verifiable on Coursera</tspan></text>
</svg>
